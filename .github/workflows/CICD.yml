name: CI/CD Pipeline

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday at midnight

jobs:
  build_php_containers:
    if: github.event_name == 'schedule' || contains(fromJSON('["refs/heads/main"]'), github.ref)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- WEB VARIANTS (FPM/Apache) ---
          # PHP 8.4
          - php: 8.4-fpm-alpine
            extensions: composer bcmath bz2 exif gd gmp intl mysqli opcache pgsql redis soap sockets xsl yaml zip
          - php: 8.4-fpm-alpine
            extensions: composer bcmath bz2 exif gd gmp imagick intl mysqli opcache pcov pgsql redis soap sockets xdebug xsl yaml zip
          - php: 8.4-fpm
            extensions: composer bcmath bz2 exif gd gmp intl mysqli opcache pgsql redis soap sockets xsl yaml zip
          - php: 8.4-fpm
            extensions: composer bcmath bz2 exif gd gmp imagick intl mysqli opcache pcov pgsql redis soap sockets xdebug xsl yaml zip
          - php: 8.4-apache
            extensions: composer bcmath bz2 exif gd gmp intl mysqli opcache pgsql redis soap sockets xsl yaml zip
          - php: 8.4-apache
            extensions: composer bcmath bz2 exif gd gmp imagick intl mysqli opcache pcov pgsql redis soap sockets xdebug xsl yaml zip
          
          # PHP 8.3
          - php: 8.3-fpm-alpine
            extensions: composer bcmath bz2 exif gd gmp intl mysqli opcache pgsql redis soap sockets xsl yaml zip
          - php: 8.3-fpm-alpine
            extensions: composer bcmath bz2 exif gd gmp imagick intl mysqli opcache pcov pgsql redis soap sockets xdebug xsl yaml zip
          - php: 8.3-fpm
            extensions: composer bcmath bz2 exif gd gmp intl mysqli opcache pgsql redis soap sockets xsl yaml zip
          - php: 8.3-fpm
            extensions: composer bcmath bz2 exif gd gmp imagick intl mysqli opcache pcov pgsql redis soap sockets xdebug xsl yaml zip
          - php: 8.3-apache
            extensions: composer bcmath bz2 exif gd gmp intl mysqli opcache pgsql redis soap sockets xsl yaml zip
          - php: 8.3-apache
            extensions: composer bcmath bz2 exif gd gmp imagick intl mysqli opcache pcov pgsql redis soap sockets xdebug xsl yaml zip

          # PHP 8.2
          - php: 8.2-fpm-alpine
            extensions: composer bcmath bz2 exif gd gmp intl mysqli opcache pgsql redis soap sockets xsl yaml zip
          - php: 8.2-fpm-alpine
            extensions: composer bcmath bz2 exif gd gmp imagick intl mysqli opcache pcov pgsql redis soap sockets xdebug xsl yaml zip
          - php: 8.2-fpm
            extensions: composer bcmath bz2 exif gd gmp intl mysqli opcache pgsql redis soap sockets xsl yaml zip
          - php: 8.2-fpm
            extensions: composer bcmath bz2 exif gd gmp imagick intl mysqli opcache pcov pgsql redis soap sockets xdebug xsl yaml zip
          - php: 8.2-apache
            extensions: composer bcmath bz2 exif gd gmp intl mysqli opcache pgsql redis soap sockets xsl yaml zip
          - php: 8.2-apache
            extensions: composer bcmath bz2 exif gd gmp imagick intl mysqli opcache pcov pgsql redis soap sockets xdebug xsl yaml zip

          # --- CLI VARIANTS ---
          # PHP 8.4
          - php: 8.4-cli
            extensions: composer bcmath bz2 exif gd gmp mysqli pcntl pgsql redis soap sockets xsl yaml zip
          - php: 8.4-cli
            extensions: composer bcmath bz2 exif gd gmp mysqli pcntl pgsql redis soap sockets xdebug xsl yaml zip
          - php: 8.4-cli
            extensions: composer bcmath bz2 exif gd gmp imagick mysqli pcntl pgsql redis soap sockets xsl yaml zip
          - php: 8.4-cli
            extensions: composer bcmath bz2 exif gd gmp imagick mysqli pcntl pgsql redis soap sockets xdebug xsl yaml zip
          - php: 8.4-cli-alpine
            extensions: composer bcmath bz2 exif gd gmp mysqli pcntl pgsql redis soap sockets xsl yaml zip
          - php: 8.4-cli-alpine
            extensions: composer bcmath bz2 exif gd gmp mysqli pcntl pgsql redis soap sockets xdebug xsl yaml zip
          - php: 8.4-cli-alpine
            extensions: composer bcmath bz2 exif gd gmp imagick mysqli pcntl pgsql redis soap sockets xsl yaml zip
          - php: 8.4-cli-alpine
            extensions: composer bcmath bz2 exif gd gmp imagick mysqli pcntl pgsql redis soap sockets xdebug xsl yaml zip

          # PHP 8.3
          - php: 8.3-cli
            extensions: composer bcmath bz2 exif gd gmp mysqli pcntl pgsql redis soap sockets xsl yaml zip
          - php: 8.3-cli
            extensions: composer bcmath bz2 exif gd gmp mysqli pcntl pgsql redis soap sockets xdebug xsl yaml zip
          - php: 8.3-cli
            extensions: composer bcmath bz2 exif gd gmp imagick mysqli pcntl pgsql redis soap sockets xsl yaml zip
          - php: 8.3-cli
            extensions: composer bcmath bz2 exif gd gmp imagick mysqli pcntl pgsql redis soap sockets xdebug xsl yaml zip
          - php: 8.3-cli-alpine
            extensions: composer bcmath bz2 exif gd gmp mysqli pcntl pgsql redis soap sockets xsl yaml zip
          - php: 8.3-cli-alpine
            extensions: composer bcmath bz2 exif gd gmp mysqli pcntl pgsql redis soap sockets xdebug xsl yaml zip
          - php: 8.3-cli-alpine
            extensions: composer bcmath bz2 exif gd gmp imagick mysqli pcntl pgsql redis soap sockets xsl yaml zip
          - php: 8.3-cli-alpine
            extensions: composer bcmath bz2 exif gd gmp imagick mysqli pcntl pgsql redis soap sockets xdebug xsl yaml zip

          # PHP 8.2
          - php: 8.2-cli
            extensions: composer bcmath bz2 exif gd gmp mysqli pcntl pgsql redis soap sockets xsl yaml zip
          - php: 8.2-cli
            extensions: composer bcmath bz2 exif gd gmp mysqli pcntl pgsql redis soap sockets xdebug xsl yaml zip
          - php: 8.2-cli
            extensions: composer bcmath bz2 exif gd gmp imagick mysqli pcntl pgsql redis soap sockets xsl yaml zip
          - php: 8.2-cli
            extensions: composer bcmath bz2 exif gd gmp imagick mysqli pcntl pgsql redis soap sockets xdebug xsl yaml zip
          - php: 8.2-cli-alpine
            extensions: composer bcmath bz2 exif gd gmp mysqli pcntl pgsql redis soap sockets xsl yaml zip
          - php: 8.2-cli-alpine
            extensions: composer bcmath bz2 exif gd gmp mysqli pcntl pgsql redis soap sockets xdebug xsl yaml zip
          - php: 8.2-cli-alpine
            extensions: composer bcmath bz2 exif gd gmp imagick mysqli pcntl pgsql redis soap sockets xsl yaml zip
          - php: 8.2-cli-alpine
            extensions: composer bcmath bz2 exif gd gmp imagick mysqli pcntl pgsql redis soap sockets xdebug xsl yaml zip

    name: Build ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate output tag
        id: output_tag
        run: |
          OUTPUT_TAG=$(./bin/generate-tag ${{ matrix.php }} ${{ matrix.extensions }})
          echo "output_tag=$OUTPUT_TAG" >> $GITHUB_OUTPUT
          echo "Building: $OUTPUT_TAG"
      
      - name: Build dockerfile
        run: |
          ./bin/builddockerfile ${{ matrix.php }} ${{ matrix.extensions }} > dockerfile
          cat dockerfile

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container
        uses: docker/build-push-action@v5
        with:
          provenance: false
          context: .
          file: dockerfile
          push: true
          load: true
          tags: ghcr.io/barretstorck/php:${{ steps.output_tag.outputs.output_tag }}
          platforms: linux/amd64
          build-args: |
            PHP_TAG=${{ matrix.php }}

      - name: Verify extensions
        run: |
          IMAGE=ghcr.io/barretstorck/php:${{ steps.output_tag.outputs.output_tag }}
          for ext in ${{ matrix.extensions }}; do
            ./bin/verify-extension $IMAGE $ext
          done
