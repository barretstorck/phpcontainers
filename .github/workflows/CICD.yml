name: CI/CD Pipeline

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main

jobs:
  build_php_containers:
    if: contains(fromJSON('["refs/heads/main"]'), github.ref)
    # Define what containers to build here
    strategy:
      matrix:
        include:
          - php:
              - 8.4-fpm-alpine
              - 8.4-fpm
              - 8.4-apache
              - 8.3-fpm-alpine
              - 8.3-fpm
              - 8.3-apache
              - 8.2-fpm-alpine
              - 8.2-fpm
              - 8.2-apache
            extensions:
              - composer bcmath bz2 exif gd gmp intl mysqli opcache pgsql redis soap sockets xsl yaml zip
              - composer bcmath bz2 exif gd gmp imagick intl mysqli opcache pcov pgsql redis soap sockets xdebug xsl yaml zip
          - php:
              - 8.4-cli
              - 8.4-cli-alpine
              - 8.3-cli
              - 8.3-cli-alpine
              - 8.2-cli
              - 8.2-cli-alpine
            extension:
              - composer bcmath bz2 exif gd gmp mysqli pcntl pgsql redis soap sockets xsl yaml zip
              - composer bcmath bz2 exif gd gmp mysqli pcntl pgsql redis soap sockets xdebug xsl yaml zip
              - composer bcmath bz2 exif gd gmp imagick mysqli pcntl pgsql redis soap sockets xsl yaml zip
              - composer bcmath bz2 exif gd gmp imagick mysqli pcntl pgsql redis soap sockets xdebug xsl yaml zip

    name: Build ${{ matrix.php }} with ${{ matrix.extensions }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate output tag
        id: output_tag
        run: |
          OUTPUT_TAG=$(./bin/generate-tag ${{ matrix.php }} ${{ matrix.extensions }})
          echo "output_tag=$OUTPUT_TAG" >> $GITHUB_OUTPUT
          echo $OUTPUT_TAG
      
      - name: Build dockerfile
        run: |
          ./bin/builddockerfile ${{ matrix.php }} ${{ matrix.extensions }} > dockerfile
          cat dockerfile

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container
        uses: docker/build-push-action@v5
        with:
          provenance: false
          context: .
          file: dockerfile
          push: true
          load: true
          tags: ghcr.io/barretstorck/php:${{ steps.output_tag.outputs.output_tag }}
          platforms: linux/amd64
          build-args: |
            PHP_TAG=${{ matrix.php }}

      - name: Verify extensions
        run: |
          IMAGE=ghcr.io/barretstorck/php:${{ steps.output_tag.outputs.output_tag }}
          for ext in ${{ matrix.extensions }}; do
            ./bin/verify-extension $IMAGE $ext
          done