name: CI/CD Pipeline

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  schedule:
    # Weekly, Monday 05:17 UTC. Deliberately off the top of the hour and away
    # from 00:00 UTC -- GitHub's busiest cron windows, where scheduled runs are
    # routinely delayed and sometimes dropped entirely.
    - cron: '17 5 * * 1'
  workflow_dispatch:

jobs:
  build_php_containers:
    if: github.event_name != 'push' || contains(fromJSON('["refs/heads/main"]'), github.ref)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- WEB VARIANTS (FPM/Apache) ---
          # PHP 8.4
          - php: 8.4-fpm-alpine
            extensions: composer bcmath bz2 exif gd gmp intl mysqli opcache pgsql redis soap sockets xsl yaml zip
          - php: 8.4-fpm-alpine
            extensions: composer bcmath bz2 exif gd gmp imagick intl mysqli opcache pcov pgsql redis soap sockets xdebug xsl yaml zip
          - php: 8.4-fpm
            extensions: composer bcmath bz2 exif gd gmp intl mysqli opcache pgsql redis soap sockets xsl yaml zip
          - php: 8.4-fpm
            extensions: composer bcmath bz2 exif gd gmp imagick intl mysqli opcache pcov pgsql redis soap sockets xdebug xsl yaml zip
          - php: 8.4-apache
            extensions: composer bcmath bz2 exif gd gmp intl mysqli opcache pgsql redis soap sockets xsl yaml zip
          - php: 8.4-apache
            extensions: composer bcmath bz2 exif gd gmp imagick intl mysqli opcache pcov pgsql redis soap sockets xdebug xsl yaml zip
          
          # PHP 8.3
          - php: 8.3-fpm-alpine
            extensions: composer bcmath bz2 exif gd gmp intl mysqli opcache pgsql redis soap sockets xsl yaml zip
          - php: 8.3-fpm-alpine
            extensions: composer bcmath bz2 exif gd gmp imagick intl mysqli opcache pcov pgsql redis soap sockets xdebug xsl yaml zip
          - php: 8.3-fpm
            extensions: composer bcmath bz2 exif gd gmp intl mysqli opcache pgsql redis soap sockets xsl yaml zip
          - php: 8.3-fpm
            extensions: composer bcmath bz2 exif gd gmp imagick intl mysqli opcache pcov pgsql redis soap sockets xdebug xsl yaml zip
          - php: 8.3-apache
            extensions: composer bcmath bz2 exif gd gmp intl mysqli opcache pgsql redis soap sockets xsl yaml zip
          - php: 8.3-apache
            extensions: composer bcmath bz2 exif gd gmp imagick intl mysqli opcache pcov pgsql redis soap sockets xdebug xsl yaml zip

          # PHP 8.2
          - php: 8.2-fpm-alpine
            extensions: composer bcmath bz2 exif gd gmp intl mysqli opcache pgsql redis soap sockets xsl yaml zip
          - php: 8.2-fpm-alpine
            extensions: composer bcmath bz2 exif gd gmp imagick intl mysqli opcache pcov pgsql redis soap sockets xdebug xsl yaml zip
          - php: 8.2-fpm
            extensions: composer bcmath bz2 exif gd gmp intl mysqli opcache pgsql redis soap sockets xsl yaml zip
          - php: 8.2-fpm
            extensions: composer bcmath bz2 exif gd gmp imagick intl mysqli opcache pcov pgsql redis soap sockets xdebug xsl yaml zip
          - php: 8.2-apache
            extensions: composer bcmath bz2 exif gd gmp intl mysqli opcache pgsql redis soap sockets xsl yaml zip
          - php: 8.2-apache
            extensions: composer bcmath bz2 exif gd gmp imagick intl mysqli opcache pcov pgsql redis soap sockets xdebug xsl yaml zip

          # --- CLI VARIANTS ---
          # PHP 8.4
          - php: 8.4-cli
            extensions: composer bcmath bz2 exif gd gmp mysqli pcntl pgsql redis soap sockets xsl yaml zip
          - php: 8.4-cli
            extensions: composer bcmath bz2 exif gd gmp mysqli pcntl pgsql redis soap sockets xdebug xsl yaml zip
          - php: 8.4-cli
            extensions: composer bcmath bz2 exif gd gmp imagick mysqli pcntl pgsql redis soap sockets xsl yaml zip
          - php: 8.4-cli
            extensions: composer bcmath bz2 exif gd gmp imagick mysqli pcntl pgsql redis soap sockets xdebug xsl yaml zip
          - php: 8.4-cli-alpine
            extensions: composer bcmath bz2 exif gd gmp mysqli pcntl pgsql redis soap sockets xsl yaml zip
          - php: 8.4-cli-alpine
            extensions: composer bcmath bz2 exif gd gmp mysqli pcntl pgsql redis soap sockets xdebug xsl yaml zip
          - php: 8.4-cli-alpine
            extensions: composer bcmath bz2 exif gd gmp imagick mysqli pcntl pgsql redis soap sockets xsl yaml zip
          - php: 8.4-cli-alpine
            extensions: composer bcmath bz2 exif gd gmp imagick mysqli pcntl pgsql redis soap sockets xdebug xsl yaml zip

          # PHP 8.3
          - php: 8.3-cli
            extensions: composer bcmath bz2 exif gd gmp mysqli pcntl pgsql redis soap sockets xsl yaml zip
          - php: 8.3-cli
            extensions: composer bcmath bz2 exif gd gmp mysqli pcntl pgsql redis soap sockets xdebug xsl yaml zip
          - php: 8.3-cli
            extensions: composer bcmath bz2 exif gd gmp imagick mysqli pcntl pgsql redis soap sockets xsl yaml zip
          - php: 8.3-cli
            extensions: composer bcmath bz2 exif gd gmp imagick mysqli pcntl pgsql redis soap sockets xdebug xsl yaml zip
          - php: 8.3-cli-alpine
            extensions: composer bcmath bz2 exif gd gmp mysqli pcntl pgsql redis soap sockets xsl yaml zip
          - php: 8.3-cli-alpine
            extensions: composer bcmath bz2 exif gd gmp mysqli pcntl pgsql redis soap sockets xdebug xsl yaml zip
          - php: 8.3-cli-alpine
            extensions: composer bcmath bz2 exif gd gmp imagick mysqli pcntl pgsql redis soap sockets xsl yaml zip
          - php: 8.3-cli-alpine
            extensions: composer bcmath bz2 exif gd gmp imagick mysqli pcntl pgsql redis soap sockets xdebug xsl yaml zip

          # PHP 8.2
          - php: 8.2-cli
            extensions: composer bcmath bz2 exif gd gmp mysqli pcntl pgsql redis soap sockets xsl yaml zip
          - php: 8.2-cli
            extensions: composer bcmath bz2 exif gd gmp mysqli pcntl pgsql redis soap sockets xdebug xsl yaml zip
          - php: 8.2-cli
            extensions: composer bcmath bz2 exif gd gmp imagick mysqli pcntl pgsql redis soap sockets xsl yaml zip
          - php: 8.2-cli
            extensions: composer bcmath bz2 exif gd gmp imagick mysqli pcntl pgsql redis soap sockets xdebug xsl yaml zip
          - php: 8.2-cli-alpine
            extensions: composer bcmath bz2 exif gd gmp mysqli pcntl pgsql redis soap sockets xsl yaml zip
          - php: 8.2-cli-alpine
            extensions: composer bcmath bz2 exif gd gmp mysqli pcntl pgsql redis soap sockets xdebug xsl yaml zip
          - php: 8.2-cli-alpine
            extensions: composer bcmath bz2 exif gd gmp imagick mysqli pcntl pgsql redis soap sockets xsl yaml zip
          - php: 8.2-cli-alpine
            extensions: composer bcmath bz2 exif gd gmp imagick mysqli pcntl pgsql redis soap sockets xdebug xsl yaml zip

    name: Build ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate output tag
        id: output_tag
        run: |
          OUTPUT_TAG=$(./bin/generate-tag ${{ matrix.php }} ${{ matrix.extensions }})
          echo "output_tag=$OUTPUT_TAG" >> $GITHUB_OUTPUT
          echo "Building: $OUTPUT_TAG"
      
      - name: Build dockerfile
        run: |
          ./bin/builddockerfile ${{ matrix.php }} ${{ matrix.extensions }} > dockerfile
          cat dockerfile

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container
        uses: docker/build-push-action@v5
        with:
          provenance: false
          context: .
          file: dockerfile
          push: true
          load: true
          tags: ghcr.io/barretstorck/php:${{ steps.output_tag.outputs.output_tag }}
          platforms: linux/amd64
          build-args: |
            PHP_TAG=${{ matrix.php }}

      - name: Verify extensions
        run: |
          IMAGE=ghcr.io/barretstorck/php:${{ steps.output_tag.outputs.output_tag }}
          for ext in ${{ matrix.extensions }}; do
            ./bin/verify-extension $IMAGE $ext
          done

  # GitHub stops scheduling cron workflows in public repositories after 60 days
  # with no commit activity. This job pushes a build receipt after every
  # scheduled/manual run, which resets that clock. Pushes made with GITHUB_TOKEN
  # do not trigger workflows, so this cannot cause a build loop.
  keepalive:
    name: Keep schedule alive
    needs: build_php_containers
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Record build receipt
        run: |
          {
            echo "last_run_utc:   $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "trigger:        ${{ github.event_name }}"
            echo "build_result:   ${{ needs.build_php_containers.result }}"
            echo "run_url:        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > .github/last-build.txt
          cat .github/last-build.txt

      - name: Commit and push
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/last-build.txt
          if git diff --cached --quiet; then
            echo 'No change to commit.'
            exit 0
          fi
          git commit -m 'chore: record scheduled build [skip ci]'
          # main can move during a 42-job build; rebase and retry rather than
          # letting a lost race silently stop resetting the inactivity clock.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push attempt $attempt failed; rebasing onto origin/main"
            git fetch origin main
            git rebase origin/main
          done
          echo 'Could not push build receipt after 3 attempts.' >&2
          exit 1
